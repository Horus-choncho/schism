name: Build Windows Portable Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pandas scipy statsmodels PyQt6 pyqtgraph

      - name: Run Windows Build Script
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: VibePadSchism-0.9.0-alpha-Windows-Portable
          path: dist/*.zip
