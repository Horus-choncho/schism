name: Build Windows Portable Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller numpy pandas scipy statsmodels PyQt6 pyqtgraph

      - name: Run Windows Build Script
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          if (Test-Path scripts\build_windows.ps1) {
              .\scripts\build_windows.ps1
          } else {
              pyinstaller --name VibePadSchism --onedir --windowed --icon src/ui/logo.png --add-data "src/ui/logo.png;src/ui" --hidden-import scipy.special.cython_special --hidden-import statsmodels.stats.anova src/main.py
              Compress-Archive -Path dist/VibePadSchism -DestinationPath dist/VibePadSchism-Windows-Portable.zip
          }

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: VibePadSchism-Windows-Portable
          path: dist/*.zip
