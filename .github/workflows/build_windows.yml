name: Build Windows Portable Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy pandas scipy statsmodels PyQt6 pyqtgraph

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: |
          python -m PyInstaller --name VibePadSchism --onedir --windowed --noconfirm --clean --hidden-import scipy.special.cython_special --hidden-import statsmodels.stats.anova src/main.py

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VibePadSchism -DestinationPath dist/VibePadSchism-Windows-Portable.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibePadSchism-Windows-Portable
          path: dist/VibePadSchism-Windows-Portable.zip
