name: Build Windows Portable Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tooling & Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller numpy pandas scipy statsmodels PyQt6 pyqtgraph

      - name: Compile Executable via PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          python -m PyInstaller --name VibePadSchism --onedir --windowed --noconfirm --clean --collect-submodules scipy --hidden-import scipy.special.cython_special --hidden-import statsmodels.stats.anova src/main.py

      - name: Copy UI Assets to Distribution Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/VibePadSchism/src/ui
          if (Test-Path src/ui/logo.png) { Copy-Item src/ui/logo.png dist/VibePadSchism/src/ui/logo.png }

      - name: Package Standalone Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VibePadSchism -DestinationPath dist/VibePadSchism-Windows-Portable.zip -Force

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VibePadSchism-Windows-Portable
          path: dist/VibePadSchism-Windows-Portable.zip
